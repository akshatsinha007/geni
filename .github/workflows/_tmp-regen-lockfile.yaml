name: TEMP regen lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - fix/sqlx-tls-sslmode

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sqlx-tls-sslmode
      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile
      - name: Commit if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Regenerate Cargo.lock for sqlx tls-rustls-ring-webpki feature"
          git push origin HEAD:fix/sqlx-tls-sslmode
